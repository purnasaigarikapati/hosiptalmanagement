services:
  # Altrix Health Web Service (Express API + Vite SPA Frontend)
  - type: web
    name: altrix-health
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: altrix-health-db
          property: connectionString
      - key: PORT
        value: 10000

# Managed PostgreSQL Database on Render
databases:
  - name: altrix-health-db
    plan: free
    region: oregon
    databaseName: altrix_health
    user: altrix_admin
